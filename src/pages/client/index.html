<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tienda - Food Store</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Catálogo de Comidas</h1>
    <p>Bienvenido a la tienda. ¡Explora nuestros platos disponibles!</p>
    
    <button id="btn-logout" style="padding: 10px; cursor: pointer;">Cerrar Sesión</button>

    <script type="module">
        import { checkAuth, logout } from '../../utils/auth.js';
        
        checkAuth('client');

        document.querySelector('#btn-logout')?.addEventListener('click', () => {
            logout();
        });
    </script>
</body>
</html>
