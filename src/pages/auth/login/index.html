<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Food Store</title>
</head>
<body style="font-family: sans-serif; text-align: center; margin-top: 50px;">
    <h2>Iniciar Sesión</h2>
    <form id="form-login" style="display: flex; flex-direction: column; width: 300px; margin: 0 auto; gap: 15px;">
        <label for="email">Correo Electrónico:</label>
        <input type="email" id="email" name="email" required>
        
        <label for="password">Contraseña:</label>
        <input type="password" id="password" name="password" required>
        
        <button type="submit" style="padding: 10px; cursor: pointer;">Ingresar</button>
    </form>

    <br>
    <a href="../registro/index.html">¿No tienes cuenta? Regístrate aquí</a>
    <br><br>
    <a href="../../../../index.html">Volver al inicio</a>

    <script type="module" src="./login.ts"></script>
</body>
</html>
