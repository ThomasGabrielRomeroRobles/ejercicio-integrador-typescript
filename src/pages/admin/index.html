<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Administrador - Food Store</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">
    <h1>Panel de Administración</h1>
    <p>Bienvenido, Administrador. Aquí puedes gestionar productos y usuarios.</p>
    
    <button id="btn-logout" style="padding: 10px; cursor: pointer;">Cerrar Sesión</button>

    <script type="module">
        import { checkAuth, logout } from '../../utils/auth.js';
        
        checkAuth('admin');

        document.querySelector('#btn-logout')?.addEventListener('click', () => {
            logout();
        });
    </script>
</body>
</html>
